name: Build iPhoto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Unit tests
        run: |
          chmod +x Tests/run_stacking.sh Tests/run_catalog.sh Tests/run_adjustments.sh Tests/run_librarystore.sh Tests/test_formats.sh Tests/run_viewsmoke.sh Tests/run_plugins.sh Tests/run_cli.sh
          Tests/run_stacking.sh
          Tests/run_catalog.sh
          Tests/run_adjustments.sh
          Tests/run_librarystore.sh
          Tests/test_formats.sh
          Tests/run_viewsmoke.sh
          Tests/run_plugins.sh
          Tests/run_cli.sh

      - name: Zip app
        run: |
          VERSION=$(defaults read "$PWD/Resources/Info.plist" CFBundleShortVersionString)
          APP_NAME=$(sed -n 's/^APP_NAME="\(.*\)"$/\1/p' build.sh)
          (cd build && zip -r "../iPhoto-${VERSION}.zip" "${APP_NAME}.app")
          echo "ZIP_NAME=iPhoto-${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
